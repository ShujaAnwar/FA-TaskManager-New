
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fiqh Academy Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Segoe+UI&display=swap" rel="stylesheet">
    <!-- PDF Generation Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
      /* Support the Arabic font */
      .font-arabic {
        font-family: 'Noto Naskh Arabic', serif;
      }
      .dot {
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Pulsing animations for High/Urgent tasks */
      @keyframes pulse-red {
        0% { background-color: rgba(239, 68, 68, 0.05); }
        50% { background-color: rgba(239, 68, 68, 0.2); }
        100% { background-color: rgba(239, 68, 68, 0.05); }
      }
      
      @keyframes pulse-orange {
        0% { background-color: rgba(245, 158, 11, 0.05); }
        50% { background-color: rgba(245, 158, 11, 0.15); }
        100% { background-color: rgba(245, 158, 11, 0.05); }
      }

      .animate-pulse-red {
        animation: pulse-red 2s infinite ease-in-out;
        border-left: 4px solid #dc2626 !important;
      }

      .animate-pulse-orange {
        animation: pulse-orange 3s infinite ease-in-out;
        border-left: 4px solid #f59e0b !important;
      }
    </style>
  <script type="importmap">

  }
}
</script>
</head>

</html>
